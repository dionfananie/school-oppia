<!doctype html>
<!--
  Kila Games · Seri 2 — Learning & Engagement untuk anak 2–7 tahun.
  Mobile-first, satu file: hub + 17 permainan baru (memori/logika, huruf, kreatif).
  Level 1–5, feedback instan, animasi (WAAPI + CSS), suara sintesis (Web Audio),
  instruksi audio singkat (speechSynthesis id-ID), pencapaian, unlock berbasis
  bintang (menggabungkan progres Seri 1), dan layar laporan orang tua.
  Token: direction human-approachable (sama dengan kila-games.html & kila-homepage.html).
-->
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kila Games Seri 2: 17 permainan baru untuk anak usia 2–7 tahun — memori, logika, huruf, mewarnai & musik. Tanpa iklan, dengan suara dan laporan orang tua." />
  <meta name="theme-color" content="#f8fafc" />
  <title>Kila Games · Seri 2 — Belajar & bermain untuk anak 2–7 tahun</title>
  <style>
    /* ─── tokens (direction human-approachable, sama dengan Seri 1) ─── */
    :root {
      --bg:      oklch(98% 0.004 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(20% 0.02 240);
      --muted:   oklch(50% 0.018 240);
      --muted-strong: color-mix(in oklch, var(--muted) 76%, black);
      --border:  oklch(90% 0.006 240);
      --accent:  oklch(56% 0.12 170);

      --sun:     oklch(0.80 0.16 88);
      --mint:    oklch(0.74 0.13 158);
      --coral:   oklch(0.73 0.16 30);
      --sky:     oklch(0.72 0.12 235);
      --grape:   oklch(0.66 0.20 295);
      --pink:    oklch(0.70 0.19 345);
      --ink-sun:   color-mix(in oklch, var(--sun) 52%, black);
      --ink-mint:  color-mix(in oklch, var(--mint) 52%, black);
      --ink-coral: color-mix(in oklch, var(--coral) 52%, black);
      --ink-sky:   color-mix(in oklch, var(--sky) 52%, black);
      --tile-sun:   color-mix(in oklch, var(--sun) 24%, var(--surface));
      --tile-mint:  color-mix(in oklch, var(--mint) 24%, var(--surface));
      --tile-coral: color-mix(in oklch, var(--coral) 24%, var(--surface));
      --tile-sky:   color-mix(in oklch, var(--sky) 24%, var(--surface));
      --tile-grape: color-mix(in oklch, var(--grape) 24%, var(--surface));
      --tile-pink:  color-mix(in oklch, var(--pink) 24%, var(--surface));

      --accent-deep: color-mix(in oklch, var(--accent) 82%, black);
      --accent-text: color-mix(in oklch, var(--accent) 64%, black);
      --ok:   oklch(0.62 0.16 155);
      --ok-soft:   color-mix(in oklch, var(--ok) 16%, var(--surface));
      --err:  oklch(0.58 0.18 26);
      --err-soft:  color-mix(in oklch, var(--err) 16%, var(--surface));
      --gold: oklch(0.80 0.16 85);

      --font-display: 'Söhne', 'Avenir Next', 'Avenir', 'Century Gothic', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

      --fs-body: 16px;
      --fs-meta: 13px;
      --gutter: clamp(18px, 5vw, 30px);
      --radius: 14px;
      --radius-lg: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    a { color: inherit; }
    p { margin: 0; }
    :focus-visible {
      outline: 3px solid color-mix(in oklch, var(--accent) 45%, transparent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .app { max-width: 560px; margin: 0 auto; padding: var(--gutter) var(--gutter) 72px; }
    .i { width: 24px; height: 24px; }

    /* ─── hub ─────────────────────────────────────────────────────────── */
    .brand-row { display: flex; align-items: center; gap: 10px; padding: 6px 0 0; flex-wrap: wrap; }
    .brand { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 7vw, 32px); letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
    .brand-dot { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); }
    .tagline { font-size: var(--fs-meta); color: var(--muted-strong); margin-right: auto; }
    .hub-note { background: var(--tile-sun); color: var(--ink-sun); font-size: var(--fs-meta); padding: 10px 14px; border-radius: var(--radius); margin: 16px 0 4px; }

    .resume { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; width: 100%; margin-top: 16px; text-align: left; box-shadow: 0 4px 14px color-mix(in oklch, var(--fg) 6%, transparent); }
    .resume:hover { border-color: color-mix(in oklch, var(--fg) 24%, transparent); }
    .resume-txt { flex: 1; min-width: 0; }
    .resume-l { font-family: var(--font-display); font-weight: 800; font-size: 15px; display: block; }
    .resume-s { font-size: 12px; color: var(--muted-strong); }

    .pstrip { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; margin-top: 14px; }
    .pstrip .i { width: 20px; height: 20px; color: var(--gold); flex: none; }
    .pstrip-bar { flex: 1; height: 10px; border-radius: 999px; background: color-mix(in oklch, var(--fg) 8%, transparent); overflow: hidden; }
    .pstrip-fill { height: 100%; border-radius: 999px; background: var(--gold); transition: width .4s ease; }
    .pstrip-txt { font-size: 12px; color: var(--muted-strong); font-family: var(--font-mono); font-weight: 800; }

    .cat { margin-top: var(--radius); }
    .cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .cat-chip { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
    .cat-chip .i { width: 21px; height: 21px; }
    .chip-sun { background: var(--sun); }
    .chip-mint { background: var(--mint); }
    .chip-coral { background: var(--coral); }
    .cat-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
    .cat-desc { font-size: 12px; color: var(--muted-strong); margin-left: auto; text-align: right; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .gcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; text-align: left; box-shadow: 0 1px 2px color-mix(in oklch, var(--fg) 4%, transparent); transition: transform .15s ease, box-shadow .15s ease; }
    .gcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px color-mix(in oklch, var(--fg) 10%, transparent); }
    .gcard:active { transform: scale(0.98); }
    .g-ic { position: relative; width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; }
    .g-ic::before { content: ""; position: absolute; inset: 5px; background: var(--surface); border-radius: 11px; }
    .g-ic svg { position: relative; width: 36px; height: 36px; }
    .tile-sun { background: var(--tile-sun); } .tile-mint { background: var(--tile-mint); } .tile-coral { background: var(--tile-coral); } .tile-sky { background: var(--tile-sky); } .tile-grape { background: var(--tile-grape); } .tile-pink { background: var(--tile-pink); }
    .g-name { font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1.2; }
    .g-meta { font-size: 12px; color: var(--muted-strong); display: flex; align-items: center; gap: 5px; }
    .g-meta .i { width: 13px; height: 13px; color: var(--gold); }
    .gcard.locked { opacity: .66; }
    .gcard.locked .g-meta { color: color-mix(in oklch, var(--muted-strong) 80%, var(--fg)); }
    .lock-g { position: relative; color: var(--muted-strong); }
    .lock-g .i { width: 26px; height: 26px; }

    .foot { margin-top: var(--radius); text-align: center; font-size: 12px; color: var(--muted); }
    .tbtn { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--fg); flex: none; text-decoration: none; }
    .tbtn:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .tbtn .i { width: 22px; height: 22px; }

    /* ─── top bar permainan ───────────────────────────────────────────── */
    .top { display: flex; align-items: center; gap: 10px; padding: 4px 0 16px; }
    .top-t { flex: 1; min-width: 0; }
    .top-name { display: block; font-family: var(--font-display); font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { display: inline-block; background: var(--tile-sky); color: var(--ink-sky); font-family: var(--font-mono); font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 999px; margin-top: 2px; }
    .stars-line { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-weight: 800; font-size: 15px; color: var(--ink-coral); background: var(--tile-coral); padding: 9px 13px; border-radius: 999px; flex: none; }
    .stars-line .i { width: 16px; height: 16px; color: var(--gold); }

    .prog { display: flex; gap: 7px; justify-content: center; margin: 0 auto 20px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; background: color-mix(in oklch, var(--fg) 10%, transparent); transition: transform .2s ease; }
    .dot.done { background: var(--accent-deep); }
    .dot.cur { background: var(--accent); transform: scale(1.35); }
    .rounds { text-align: center; color: var(--ink-sky); background: var(--tile-sky); font-family: var(--font-mono); font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 999px; display: inline-block; margin: 0 auto 16px; }

    .stage { animation: rise .35s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .qa { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .q-text { font-family: var(--font-display); font-weight: 800; font-size: clamp(20px, 5.5vw, 24px); text-align: center; }
    .q-text b { color: var(--ink-coral); }

    .target { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 10px 30px color-mix(in oklch, var(--fg) 8%, transparent); width: min(224px, 66vw); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .target-letter { font-family: var(--font-display); font-weight: 800; font-size: clamp(64px, 20vw, 92px); line-height: 1; color: var(--ink-coral); display: grid; place-items: center; width: min(150px, 48vw); height: min(150px, 48vw); background: var(--tile-coral); border-radius: 34px; border: 1px solid var(--border); }
    .target-word { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 10px 30px color-mix(in oklch, var(--fg) 8%, transparent); width: min(300px, 90vw); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .w-pic { width: 72px; height: 72px; display: grid; place-items: center; }
    .w-pic svg { width: 64px; height: 64px; }
    .w-text { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 8vw, 34px); letter-spacing: .08em; }

    .pic { display: grid; place-items: center; width: clamp(76px, 23vw, 94px); height: clamp(76px, 23vw, 94px); border-radius: 50%; background: color-mix(in oklch, var(--fg) 5%, var(--surface)); border: 1px solid var(--border); }
    .pic svg { width: clamp(54px, 16vw, 70px); height: clamp(54px, 16vw, 70px); }

    .speak-btn { width: 84px; height: 84px; border-radius: 50%; border: none; background: var(--accent-deep); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px color-mix(in oklch, var(--accent) 35%, transparent); }
    .speak-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px color-mix(in oklch, var(--accent) 40%, transparent); }
    .speak-btn .i { width: 38px; height: 38px; }

    .opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 520px; }
    .opt { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 9px; min-height: 118px; transition: transform .12s ease, border-color .15s ease, background .15s ease; }
    .opt:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .opt:active { transform: scale(0.97); }
    .opt:disabled { cursor: default; }
    .opt.right { background: var(--ok-soft); border-color: var(--ok); animation: pop .4s cubic-bezier(.34, 1.56, .64, 1); }
    .opt.wrong { background: var(--err-soft); border-color: var(--err); }
    .opt.letter { padding: 16px; min-height: 96px; justify-content: center; }
    .lbig { font-family: var(--font-display); font-weight: 800; font-size: clamp(38px, 12vw, 48px); line-height: 1; }
    @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }

    /* ─── memory card ─────────────────────────────────────────────────── */
    .mgrid { display: grid; gap: 10px; width: min(420px, 100%); margin: 0 auto; perspective: 700px; }
    .mcard { position: relative; aspect-ratio: 1; border: none; background: transparent; padding: 0; }
    .mface { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; transition: transform .28s ease; backface-visibility: hidden; }
    .mfront { background: var(--surface); border: 2px solid var(--border); transform: rotateY(180deg); box-shadow: 0 6px 16px color-mix(in oklch, var(--fg) 8%, transparent); }
    .mfront svg { width: 58%; height: 58%; }
    .mback { background: var(--sky); border: 2px solid color-mix(in oklch, var(--sky) 62%, black); color: #fff; box-shadow: 0 6px 16px color-mix(in oklch, var(--fg) 10%, transparent); }
    .mback svg { width: 42%; height: 42%; }
    .mcard.up .mfront { transform: rotateY(0); }
    .mcard.up .mback { transform: rotateY(180deg); }
    .mcard.matched .mfront { border-color: var(--ok); background: var(--ok-soft); }

    /* ─── cari yang berbeda ───────────────────────────────────────────── */
    .odd-grid { display: grid; gap: 12px; width: min(440px, 100%); margin: 0 auto; }
    .odd-cell { aspect-ratio: 1; border-radius: 18px; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; transition: transform .12s ease, border-color .15s ease, background .15s ease; }
    .odd-cell:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .odd-cell:active { transform: scale(0.96); }
    .odd-cell svg { width: 64%; height: 64%; }
    .odd-cell.wrong { background: var(--err-soft); border-color: var(--err); }
    .odd-cell.right { background: var(--ok-soft); border-color: var(--ok); }
    .odd-cell.mirror svg { transform: scaleX(-1); }
    .odd-cell.big svg { width: 84%; height: 84%; }

    /* ─── urutkan ─────────────────────────────────────────────────────── */
    .order-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: min(520px, 100%); margin: 0 auto; }
    .order-item { min-width: 78px; min-height: 84px; border-radius: 18px; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 7vw, 30px); transition: transform .12s ease, border-color .15s ease, background .15s ease; }
    .order-item:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .order-item:active { transform: scale(0.95); }
    .order-item.done { border-color: var(--ok); background: var(--ok-soft); color: color-mix(in oklch, var(--ok) 55%, black); }
    .order-item svg { width: 52px; height: 52px; }

    /* ─── pola ────────────────────────────────────────────────────────── */
    .pat-row { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; max-width: 520px; margin: 0 auto; }
    .pat-chip { width: 58px; height: 58px; border-radius: 16px; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; }
    .pat-chip svg { width: 38px; height: 38px; }
    .pat-chip.q { border-style: dashed; border-color: color-mix(in oklch, var(--fg) 32%, transparent); background: color-mix(in oklch, var(--fg) 4%, transparent); }
    .pat-opts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
    .pat-opt { width: 82px; height: 82px; border-radius: 20px; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; transition: transform .12s ease, border-color .15s ease; }
    .pat-opt:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .pat-opt:active { transform: scale(0.95); }
    .pat-opt svg { width: 52px; height: 52px; }
    .pat-opt.right { background: var(--ok-soft); border-color: var(--ok); }
    .pat-opt:disabled { opacity: .55; cursor: default; }

    /* ─── mana yang hilang ────────────────────────────────────────────── */
    .miss-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; max-width: 520px; margin: 0 auto; }
    .miss-item { width: 74px; height: 74px; border-radius: 16px; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; transition: opacity .5s ease, transform .5s ease; }
    .miss-item svg { width: 48px; height: 48px; }
    .miss-item.hidden { opacity: .22; transform: scale(.84); }

    /* ─── puzzle ──────────────────────────────────────────────────────── */
    .pzl-grid { display: grid; gap: 3px; margin: 0 auto; }
    .pzl-cell { aspect-ratio: 1; border-radius: 9px; background-color: var(--tile-sky); background-repeat: no-repeat; border: 2px solid transparent; transition: border-color .15s ease, transform .12s ease; }
    .pzl-cell.correct { border-color: var(--ok); }
    .pzl-cell.sel { border-color: var(--accent); transform: scale(.95); }

    /* ─── simon (piano / drum) ────────────────────────────────────────── */
    .keys { display: flex; gap: 6px; justify-content: center; width: 100%; max-width: 460px; margin: 0 auto; }
    .key { flex: 1; min-width: 32px; max-width: 54px; height: clamp(62px, 18vw, 96px); border-radius: 12px 12px 16px 16px; border: 3px solid color-mix(in oklch, var(--fg) 16%, transparent); display: grid; place-items: end center; padding-bottom: 8px; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: #fff; transition: transform .08s ease; }
    .key.lit { transform: scale(.94); box-shadow: inset 0 0 0 4px color-mix(in oklch, var(--fg) 18%, transparent); }
    .simon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: min(440px, 100%); margin: 0 auto; }
    @media (min-width: 480px) { .simon-grid { grid-template-columns: repeat(3, 1fr); } }
    .pad { aspect-ratio: 1.3; border-radius: 20px; border: 3px solid color-mix(in oklch, var(--fg) 16%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 10px color-mix(in oklch, var(--fg) 8%, transparent); transition: transform .1s ease, box-shadow .1s ease; }
    .pad svg { width: 40%; height: 40%; }
    .pad-n { font-family: var(--font-mono); font-weight: 800; font-size: 12px; color: #fff; }
    .pad.lit { transform: scale(1.05); box-shadow: 0 0 0 5px color-mix(in oklch, var(--fg) 14%, transparent), 0 10px 22px color-mix(in oklch, var(--fg) 14%, transparent); }

    /* ─── mewarnai ────────────────────────────────────────────────────── */
    .color-scene { width: min(360px, 92vw); margin: 0 auto; }
    .color-scene svg { width: 100%; height: auto; display: block; }
    .reg { stroke: #A8AEBA; stroke-width: 3; stroke-linejoin: round; cursor: pointer; transition: fill .12s ease; }
    .reg.done { stroke: color-mix(in oklch, var(--fg) 55%, transparent); }
    .color-pal { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px auto 0; max-width: 420px; }
    .cbtn { width: 52px; height: 52px; border-radius: 50%; border: 4px solid transparent; transition: transform .1s ease, border-color .1s ease; }
    .cbtn.sel { border-color: var(--fg); transform: scale(1.12); }
    .color-tools { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
    .btn { border: none; border-radius: 999px; padding: 16px 18px; font-family: var(--font-display); font-weight: 800; font-size: 16px; flex: 1; min-height: 52px; transition: transform .12s ease, box-shadow .15s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent-deep); color: #fff; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px color-mix(in oklch, var(--accent) 30%, transparent); }
    .btn-ghost { background: var(--surface); border: 2px solid var(--border); color: var(--fg); }
    .btn-ghost:hover { border-color: color-mix(in oklch, var(--fg) 30%, transparent); }

    /* ─── shape builder ───────────────────────────────────────────────── */
    .build-scene { width: min(340px, 90vw); margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .build-slot { aspect-ratio: 1; border-radius: 18px; border: 2px dashed color-mix(in oklch, var(--fg) 28%, transparent); background: var(--surface); display: grid; place-items: center; position: relative; }
    .build-slot .sil svg { width: 48px; height: 48px; opacity: .45; filter: grayscale(.55); }
    .build-slot .slot-label { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted-strong); }
    .build-slot.filled { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
    .build-slot.filled .sil svg { opacity: 1; filter: none; }
    .build-tray { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .build-opt { width: 70px; height: 70px; border-radius: 18px; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; transition: transform .12s ease, border-color .15s ease; }
    .build-opt:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .build-opt:active { transform: scale(0.94); }
    .build-opt svg { width: 46px; height: 46px; }

    /* ─── layar akhir / selebrasi ─────────────────────────────────────── */
    .stage-end { display: flex; justify-content: center; padding-top: 10px; }
    .end-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 16px 40px color-mix(in oklch, var(--fg) 10%, transparent); padding: 28px 20px; width: min(420px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .end-card h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 7vw, 32px); margin: 0; }
    .end-card p { color: var(--muted-strong); }
    .end-stars { display: flex; gap: 4px; margin: 6px 0 2px; }
    .star { color: color-mix(in oklch, var(--fg) 14%, transparent); }
    .star .i { width: 26px; height: 26px; }
    .star.on { color: var(--gold); animation: pop .45s cubic-bezier(.34, 1.56, .64, 1) backwards; }
    .level-up { background: var(--tile-mint); color: var(--ink-mint); font-family: var(--font-display); font-weight: 800; font-size: 15px; padding: 9px 16px; border-radius: 999px; }
    .ach-new { display: flex; align-items: center; gap: 8px; background: color-mix(in oklch, var(--gold) 14%, var(--surface)); border: 2px solid var(--gold); color: color-mix(in oklch, var(--gold) 58%, black); padding: 10px 14px; border-radius: 999px; font-family: var(--font-display); font-weight: 800; font-size: 14px; }
    .ach-new .i { width: 20px; height: 20px; flex: none; }
    .end-actions { display: flex; gap: 12px; margin-top: 8px; width: 100%; }

    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 70; }
    .confetti span { position: absolute; top: -24px; display: block; border-radius: 3px; }

    /* ─── layar orang tua ─────────────────────────────────────────────── */
    .parent-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 16px 40px color-mix(in oklch, var(--fg) 8%, transparent); padding: 20px 16px; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .parent-card h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0; }
    .pstats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pstat { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
    .pstat b { display: block; font-family: var(--font-display); font-size: clamp(22px, 7vw, 28px); }
    .pstat span { font-size: 11px; color: var(--muted-strong); }
    .pcat { font-family: var(--font-display); font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
    .pbar { display: flex; align-items: center; gap: 10px; }
    .pbar .pstrip-bar { flex: 1; }
    .ach-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .ach-chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--muted-strong); display: inline-flex; gap: 6px; align-items: center; }
    .ach-chip .i { width: 14px; height: 14px; }
    .ach-chip.got { border-color: var(--gold); color: color-mix(in oklch, var(--gold) 58%, black); background: color-mix(in oklch, var(--gold) 12%, var(--surface)); font-weight: 700; }
    .fav-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .fav-row:last-child { border-bottom: none; }
    .fav-row .g-ic { width: 38px; height: 38px; border-radius: 11px; }
    .fav-row .g-ic .i { width: 20px; height: 20px; color: var(--gold); }
    .fav-row b { font-family: var(--font-mono); }
    .ptools { display: flex; gap: 10px; flex-wrap: wrap; }
    .ptools .btn { min-width: 150px; }
    .pnote { font-size: 12px; color: var(--muted-strong); }

  const audio = (() => {
    let ac = null;
    const C = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
    const t = (f, d, type, vol, delay) => {
      if (muted) return;
      const a = C(); if (!a) return;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      const s = a.currentTime + (delay || 0);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, s + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + d + 0.05);
    };
    const noise = () => {
      const a = C(); if (!a) return null;
      const len = Math.floor(a.sampleRate * 0.3);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    };
    const n = (dur, vol, hp) => {
      if (muted) return;
      const a = C(); if (!a) return;
      const b = noise(); if (!b) return;
      const src = a.createBufferSource(); src.buffer = b;
      const g = a.createGain();
      const s = a.currentTime;
      g.gain.setValueAtTime(vol || 0.2, s);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      if (hp) { const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; src.connect(f); f.connect(g); } else { src.connect(g); }
      g.connect(a.destination); src.start(s);
    };
    return {
      tap()  { t(720, 0.07, 'triangle', 0.09); },
      ok()   { t(523, 0.12, 'triangle', 0.12); t(659, 0.12, 'triangle', 0.12, 0.09); t(784, 0.18, 'triangle', 0.12, 0.18); },
      bad()  { t(240, 0.16, 'sawtooth', 0.07); t(190, 0.2, 'sawtooth', 0.07, 0.1); },
      win()  { [523, 659, 784, 1046].forEach((f, i) => t(f, 0.18, 'triangle', 0.12, i * 0.12)); },
      pop()  { t(500, 0.05, 'sine', 0.07); },
      note(f) { t(f, 0.85, 'triangle', 0.12); },
      drum(nm) {
        if (nm === 'dum') { t(150, 0.25, 'sine', 0.22); later(() => t(55, 0.3, 'sine', 0.2), 0.02); }
        else if (nm === 'tak') { n(0.12, 0.22, 1200); t(200, 0.08, 'square', 0.06); }
        else if (nm === 'sss') { n(0.06, 0.16, 5000); }
        else if (nm === 'deng') { t(130, 0.22, 'sine', 0.2); }
        else if (nm === 'tir') { n(0.14, 0.16, 2000); t(640, 0.1, 'square', 0.04); }
        else { n(0.08, 0.2, 1000); n(0.08, 0.16, 1000); t(520, 0.1, 'triangle', 0.08); }
      }
    };
  })();

    document.body.appendChild(z);
    setTimeout(() => z.remove(), 3300);
  }

  /* ─── render bersama ────────────────────────────────────────────────── */
  function topHTML() {
    return '<header class="top">' +
      '<button class="tbtn" data-act="back-hub" type="button" aria-label="Kembali ke daftar permainan">' + ICON_BACK + '</button>' +
      '<div class="top-t"><span class="top-name">' + S.game.name + '</span><span class="pill">Level ' + S.level + '</span></div>' +
      '<div class="stars-line" aria-live="polite">' + ICON_STAR + '<span id="stars-num">' + S.score + '</span></div>' +
      '<button class="tbtn" id="mutebtn" data-act="mute" type="button" aria-label="' + (muted ? 'Nyalakan suara' : 'Matikan suara') + '">' + (muted ? ICON_MUTE : ICON_SOUND) + '</button>' +
      '</header>';
  }
  function progHTML() {
    let d = '';
    for (let i = 0; i < NQ; i++) d += '<span class="dot' + (i < S.qIdx ? ' done' : i === S.qIdx ? ' cur' : '') + '"></span>';
    return '<div class="prog" role="progressbar" aria-label="Kemajuan soal" aria-valuenow="' + (S.qIdx + 1) + '" aria-valuemin="1" aria-valuemax="' + NQ + '">' + d + '</div>';
  }
  const roundsHTML = txt => '<div style="text-align:center"><span class="rounds">' + txt + '</span></div>';
  function bumpStars() {
    const el = $('#stars-num'); if (!el) return;
    el.textContent = S.score;
    if (!reduced) anim(el.parentElement, kfPop, { duration: 300, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  }

  /* ─── mesin huruf (4 game) ──────────────────────────────────────────── */
  function letterQ() {
    const g = S.game, lvN = S.level;
    const optN = Math.min(lvN + 1, 5);
    if (g.sub === 'besar-kecil') {
      const t = pick(LET);
      return { ans: t.toLowerCase(), big: t, opts: shuffle([t, ...shuffle(LET.filter(x => x !== t)).slice(0, optN - 1)]).map(x => ({ v: x.toLowerCase(), d: x.toLowerCase() })) };
    }
    if (g.sub === 'awal') {
      const w = pick(WORDS);
      const f = w.w[0];
      return { ans: f, word: w, opts: shuffle([f, ...shuffle(LET.filter(x => x !== f)).slice(0, optN - 1)]).map(x => ({ v: x, d: x })) };
    }
    const t = pick(LET);
    const audioOn = g.sub === 'dengar' || lvN >= 4;
    return { ans: t, opts: shuffle([t, ...shuffle(LET.filter(x => x !== t)).slice(0, optN - 1)]).map(x => ({ v: x, d: x })), audio: audioOn };
  }
  function renderLetterQ() {
    const q = S.q, g = S.game;
    let head;
    if (g.sub === 'besar-kecil') head = '<div class="target target-letter">' + q.big + '</div><p class="q-text">Manakah <b>huruf kecilnya</b>?</p>';
    else if (g.sub === 'awal') head = '<div class="target target-word"><span class="w-pic">' + (q.word.pic ? iconPic(q.word.pic) : '') + '</span><span class="w-text">' + q.word.w + '</span></div><p class="q-text">Apa <b>huruf awalnya</b>?</p>';
    else if (q.audio) head = '<button class="speak-btn" data-act="speak" data-v="' + q.ans + '" type="button" aria-label="Dengar nama huruf">' + ICON_SPEAK + '</button><p class="q-text">Manakah huruf <b>' + q.ans + '</b>?</p>';
    else head = '<div class="target target-letter">' + q.ans + '</div><p class="q-text">Temukan huruf yang <b>sama</b>!</p>';
    view.innerHTML = topHTML() + progHTML() + '<div class="stage" data-od-id="game-screen"><div class="qa">' + head + '<div class="opts">' + q.opts.map(o => '<button class="opt letter" data-act="answer" data-v="' + o.v + '" type="button"><span class="lbig">' + o.d + '</span></button>').join('') + '</div></div></div>';
    if (q.audio) later(() => speak('Mana huruf ' + q.ans + '?'), 420);
  }
  function onAnswer(b) {
    if (S.locked) return;
    const q = S.q, v = b.dataset.v;
    audio.tap(); press(b);
    if (v.toLowerCase() === String(q.ans).toLowerCase()) {
      stopSpeak();
      b.classList.add('right'); popEl(b); audio.ok();
      S.score++; S.locked = true;
      $$('.opt:not(.right)').forEach(o => { o.disabled = true; });
      bumpStars();
      later(nextQ, 820);
    } else {
      if (b.disabled) return;
      b.classList.add('wrong'); b.disabled = true; shake(b); audio.bad();
    }
  }

  /* ─── mesin cari yang berbeda ───────────────────────────────────────── */
  function oddQ() {
    const lvN = S.level;
    const size = [4, 6, 9, 12, 16][lvN - 1];
    const t = pick(MIXED);
    let oddSvg = t.svg, cls = '';
    const mode = lvN === 3 ? 'type' : (lvN % 2 === 0 ? 'big' : 'mirror');
    if (mode === 'type') {
      const sim = pick(SIM.filter(p => p[0] === t.id || p[1] === t.id));
      if (sim) { const oid = sim[0] === t.id ? sim[1] : sim[0]; if (BY[oid]) oddSvg = BY[oid].svg; else cls = 'mirror'; }
      else cls = 'mirror';
    } else cls = mode;
    return { others: t.svg, odd: oddSvg, cls, size, answer: 'odd' };
  }
  function renderOddQ() {
    const q = S.q;
    const cols = q.size >= 12 ? 4 : q.size >= 6 ? 3 : 2;
    const oddPos = randInt(0, q.size - 1);
    let cells = '';
    for (let i = 0; i < q.size; i++) {
      const isOdd = i === oddPos;
      cells += '<button class="odd-cell' + (isOdd ? ' ' + q.cls : '') + '" data-act="odd" data-v="' + (isOdd ? 'odd' : 'n') + '" type="button" aria-label="' + (isOdd ? 'Pilihan yang berbeda' : 'Pilihan sama') + '">' + (isOdd ? q.odd : q.others) + '</button>';
    }
    view.innerHTML = topHTML() + progHTML() + '<div class="stage"><div class="qa"><p class="q-text">Temukan yang <b>berbeda</b>!</p><div class="odd-grid" style="grid-template-columns:repeat(' + cols + ',1fr)">' + cells + '</div></div></div>';
  }
  function onOdd(b) {
    if (S.locked) return;
    audio.tap(); press(b);
    if (b.dataset.v === 'odd') {
      b.classList.add('right'); popEl(b); audio.ok();
      S.score++; S.locked = true;
      $$('.odd-cell:not(.right)').forEach(o => { o.disabled = true; });
      bumpStars();
      later(nextQ, 820);
    } else {
      if (b.disabled) return;
      b.classList.add('wrong'); b.disabled = true; shake(b); audio.bad();
    }
  }

  /* ─── mesin urutkan (angka / besar / kata) ──────────────────────────── */
  function orderQ() {
    const lvN = S.level, g = S.game;
    const n = [3, 4, 5, 6, 7][lvN - 1];
    let order = [];
    if (g.sub === 'angka') {
      const start = randInt(1, 11 - n);
      for (let i = 0; i < n; i++) order.push({ k: String(start + i), d: String(start + i), kind: 'num' });
    } else if (g.sub === 'besar') {
      const it = pick(MIXED);
      const scales = [0.5, 0.62, 0.74, 0.86, 0.98, 1.1, 1.22];
      for (let i = 0; i < n; i++) order.push({ k: it.id + '-' + i, d: i, kind: 'obj', it, w: Math.round(30 + scales[i] * 36) });
    } else {
      const len = [3, 4, 4, 5, 5][lvN - 1];
      const cand = WORDS.filter(x => x.w.length === len && new Set(x.w).size === len);
      const w = pick(cand).w;
      order = w.split('').map((ch, i) => ({ k: ch, d: ch, kind: 'let' }));
    }
    const shown = shuffle(order.map((it, i) => ({ ...it, _i: i })));
    return { order: order.map(it => it.k), shown };
  }
  function renderOrderQ() {
    const q = S.q;
    S.ord = { idx: 0, mistakes: 0 };
    const items = q.shown.map(it => {
      let inner;
      if (it.kind === 'num') inner = it.d;
      else if (it.kind === 'let') inner = it.d;
      else inner = '<span class="pic" style="width:' + it.w + 'px;height:' + it.w + 'px">' + it.it.svg + '</span>';
      return '<button class="order-item" data-act="ord" data-v="' + it.k + '" data-i="' + it._i + '" type="button">' + inner + '</button>';
    }).join('');
    view.innerHTML = topHTML() + progHTML() + '<div class="stage"><div class="qa"><p class="q-text">' + S.game.inst + '</p><div class="order-row">' + items + '</div></div></div>';
  }
  function onOrd(b) {
    if (S.locked) return;
    const ord = S.ord;
    audio.tap(); press(b);
    if (b.dataset.v === ord.order[ord.idx]) {
      b.classList.add('done'); audio.ok(); popEl(b);
      ord.idx++;
      if (ord.idx >= ord.order.length) {
        if (ord.mistakes <= 1) S.score++;
        S.locked = true; bumpStars();
        later(nextQ, 760);
      }
    } else {
      ord.mistakes++; audio.bad(); shake(b);
      if (ord.mistakes > 1) { S.locked = true; later(nextQ, 900); }
    }
  }

  /* ─── mesin lanjutkan pola ──────────────────────────────────────────── */
  function patQ() {
    const lvN = S.level;
    const n = [4, 5, 5, 6, 6][lvN - 1];
    const t = pick(['AB', 'AABB', 'ABC', 'AAB']);
    const pool = shuffle(SET.bentuk.slice());
    const a = pool[0], b = pool[1], c = pool[2];
    const at = i => {
      if (t === 'AB') return i % 2 ? b : a;
      if (t === 'AABB') return Math.floor(i / 2) % 2 ? b : a;
      if (t === 'ABC') return [a, b, c][i % 3];
      return i % 3 === 2 ? b : a;
    };
    const seq = [];
    for (let i = 0; i < n - 1; i++) seq.push(at(i));
    const ans = at(n - 1);
    const opts = shuffle([ans, ...shuffle(SET.bentuk.filter(x => x.id !== ans.id)).slice(0, 2)]);
    return { seq, ans, opts };
  }
  function renderPatQ() {
    const q = S.q;
    const chips = q.seq.map(s => '<span class="pat-chip">' + (s.draw ? s.draw(s.c) : s.svg) + '</span>').join('') + '<span class="pat-chip q">' + ICON_MISS + '</span>';
    const opts = q.opts.map(s => '<button class="pat-opt" data-act="pat" data-v="' + s.id + '" type="button" aria-label="' + s.name + '">' + (s.draw ? s.draw(s.c) : s.svg) + '</button>').join('');
    view.innerHTML = topHTML() + progHTML() + '<div class="stage"><div class="qa"><p class="q-text">Lanjutkan <b>polanya</b>!</p><div class="pat-row">' + chips + '</div><div class="pat-opts">' + opts + '</div></div></div>';
  }
  function onPat(b) {
    if (S.locked) return;
    audio.tap(); press(b);
    if (b.dataset.v === S.q.ans.id) {
      b.classList.add('right'); popEl(b); audio.ok();
      S.score++; S.locked = true;
      $$('.pat-opt:not(.right)').forEach(o => { o.disabled = true; });
      bumpStars();
      later(nextQ, 820);
    } else {
      if (b.disabled) return;
      b.classList.add('right'); b.disabled = true; shake(b); audio.bad();
      later(() => b.classList.remove('right'), 600);
    }
  }

  /* ─── mesin mana yang hilang ────────────────────────────────────────── */
  function missQ() {
    const lvN = S.level;
    const n = [3, 4, 5, 6, 6][lvN - 1];
    const items = shuffle(MIXED).slice(0, n);
    const hidden = pick(items);
    return { items, hidden: hidden.id };
  }
  function renderMissQ() {
    const q = S.q;
    const row = q.items.map(it => '<span class="miss-item" data-id="' + it.id + '">' + it.svg + '</span>').join('');
    const opts = q.items.map(it => '<button class="opt" data-act="miss" data-v="' + it.id + '" type="button"><span class="pic">' + it.svg + '</span><span class="opt-name">' + it.name + '</span></button>').join('');
    view.innerHTML = topHTML() + progHTML() + '<div class="stage"><div class="qa"><p class="q-text">Yang mana yang <b>hilang</b>?</p><div class="miss-row">' + row + '</div><div class="opts">' + opts + '</div></div></div>';
    later(() => {
      const el = $('.miss-item[data-id="' + q.hidden + '"]');
      if (el) el.classList.add('hidden');
    }, 1500);
  }
  function onMiss(b) {
    if (S.locked) return;
    audio.tap(); press(b);
    if (b.dataset.v === S.q.hidden) {
      b.classList.add('right'); popEl(b); audio.ok();
      S.score++; S.locked = true;
      $$('.opt:not(.right)').forEach(o => { o.disabled = true; });
      bumpStars();
      later(nextQ, 820);
    } else {
      if (b.disabled) return;
      b.classList.add('wrong'); b.disabled = true; shake(b); audio.bad();
    }
  }

  /* ─── mesin memory card ─────────────────────────────────────────────── */
  function beginMemory(g) {
    const pairs = [2, 3, 4, 6, 8][S.level - 1];
    const pool = shuffle(MIXED).slice(0, pairs);
    const deck = shuffle(pool.concat(pool).map((it, i) => ({ id: it.id, svg: it.svg, matched: false })));
    const cols = pairs <= 2 ? 2 : pairs <= 3 ? 3 : 4;
    S.state = { deck, cols, open: null, moves: 0, matched: 0, pairs };
    renderMemory();
  }
  function renderMemory() {
    const st = S.state;
    const cells = st.deck.map((c, i) =>
      '<button class="mcard' + (c.matched ? ' up matched' : '') + '" data-act="card" data-i="' + i + '" type="button" aria-label="Kartu ' + (i + 1) + '">' +
      '<span class="mface mback">' + ICON_MCARD + '</span>' +
      '<span class="mface mfront">' + c.svg + '</span></button>'
    ).join('');
    view.innerHTML = topHTML() + '<div style="text-align:center"><span class="rounds" id="rounds-txt">' + st.matched + ' / ' + st.pairs + ' pasang ditemukan</span></div>' +
      '<div class="stage"><div class="mgrid" style="grid-template-columns:repeat(' + st.cols + ',1fr)">' + cells + '</div></div>';
    later(() => speak(S.game.inst), 400);
  }
  function onCard(b) {
    const st = S.state;
    if (S.locked || st.busy) return;
    const i = +b.dataset.i, c = st.deck[i];
    if (c.matched) return;
    audio.pop();
    if (st.open === null) { st.open = i; b.classList.add('up'); return; }
    if (st.open === i) return;
    const openEl = $$('.mcard')[st.open];
    const first = st.deck[st.open];
    st.moves++;
    if (first.id === c.id) {
      first.matched = c.matched = true;
      openEl.classList.add('up', 'matched');
      b.classList.add('up', 'matched');
      st.matched++; audio.ok(); popEl(b);
      st.open = null;
      const t = $('#rounds-txt'); if (t) t.textContent = st.matched + ' / ' + st.pairs + ' pasang ditemukan';
      if (st.matched >= st.pairs) {
        S.score = Math.max(3, 8 - Math.max(0, st.moves - st.pairs - 2));
        later(() => endRound(S.score), 700);
      }
    } else {
      st.busy = true; audio.bad(); shake(b); shake(openEl);
      later(() => { b.classList.remove('up'); openEl.classList.remove('up'); st.busy = false; st.open = null; }, 780);
    }
  }

  /* ─── mesin puzzle ──────────────────────────────────────────────────── */
  const SCENES = {
    rumah: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><rect width="240" height="240" fill="#EFF6FF"/><circle cx="204" cy="42" r="20" fill="#FCD34D"/><path d="M24 128 L120 36 L216 128 L202 128 L202 216 L38 216 L38 128 Z" fill="#FDE68A"/><path d="M24 128 L120 36 L216 128" stroke="#D97706" stroke-width="8" fill="none" stroke-linejoin="round"/><rect x="46" y="142" width="148" height="74" rx="6" fill="#F9A8D4"/><rect x="76" y="168" width="42" height="48" rx="4" fill="#92400E"/><rect x="128" y="168" width="40" height="48" rx="4" fill="#92400E"/><rect x="150" y="150" width="24" height="24" rx="4" fill="#BFDBFE" stroke="#60A5FA" stroke-width="3"/><rect x="60" y="150" width="24" height="24" rx="4" fill="#BFDBFE" stroke="#60A5FA" stroke-width="3"/></svg>',
    ikan: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><rect width="240" height="240" fill="#E0F2FE"/><path d="M30 176 C80 190 160 190 210 176" stroke="#7DD3FC" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M30 120 C80 134 160 134 210 120" stroke="#7DD3FC" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="40" cy="48" r="8" fill="#7DD3FC" opacity=".8"/><circle cx="70" cy="30" r="6" fill="#7DD3FC" opacity=".8"/><ellipse cx="132" cy="110" rx="54" ry="38" fill="#60A5FA"/><path d="M80 110 L52 84 L52 136 Z" fill="#3B82F6"/><path d="M96 84 L122 62 L136 88 Z" fill="#2563EB"/><circle cx="146" cy="104" r="9" fill="#1E3A8A"/><circle cx="149" cy="101" r="3" fill="#fff"/></svg>'
  };
  const sceneUrl = name => 'url("data:image/svg+xml;utf8,' + encodeURIComponent(SCENES[name]) + '")';
  function beginPuzzle(g) {
    const n = g.id === 'puzzle-2-4' ? [4, 4, 6, 6, 6][S.level - 1] : [6, 6, 9, 9, 9][S.level - 1];
    const cols = n === 4 ? 2 : 3, rows = n / cols;
    const cell = n === 4 ? 112 : n === 6 ? 84 : 80;
    S.state = { n, cols, rows, cell, scene: pick(Object.keys(SCENES)), tiles: shuffle([...Array(n)].map((_, i) => i)), sel: null, moves: 0 };
    renderPuzzle();
  }
  function renderPuzzle() {
    const st = S.state;
    const W = st.cols * st.cell, H = st.rows * st.cell;
    const url = sceneUrl(st.scene);
    let cells = '';
    for (let i = 0; i < st.n; i++) {
      const o = st.tiles[i];
      const r = Math.floor(o / st.cols), c = o % st.cols;
      cells += '<button class="pzl-cell' + (o === i ? ' correct' : '') + (st.sel === i ? ' sel' : '') + '" style="background-image:' + url + ';background-size:' + W + 'px ' + H + 'px;background-position:-' + (c * st.cell) + 'px -' + (r * st.cell) + 'px;" data-act="pzl" data-i="' + i + '" type="button" aria-label="Potongan puzzle"></button>';
    }
    view.innerHTML = topHTML() + roundsHTML('Ketuk dua potongan untuk menukarnya') + '<div class="stage"><div class="pzl-grid" style="grid-template-columns:repeat(' + st.cols + ',1fr);width:' + W + 'px">' + cells + '</div></div>';
    later(() => speak(S.game.inst), 400);
  }
  function onPzl(b) {
    const st = S.state;
    if (S.locked) return;
    const i = +b.dataset.i;
    if (st.tiles[i] === i) return;
    if (st.sel === null) { st.sel = i; renderPuzzle(); audio.pop(); return; }
    if (st.sel === i) { st.sel = null; renderPuzzle(); return; }
    const a = st.tiles[st.sel];
    st.tiles[st.sel] = st.tiles[i]; st.tiles[i] = a;
    st.moves++; st.sel = null; audio.ok();
    renderPuzzle();
    if (st.tiles.every((t, k) => t === k)) {
      S.score = Math.max(3, 8 - Math.max(0, st.moves - st.n));
      later(() => endRound(S.score), 700);
    }
  }

  /* ─── mesin simon (piano / drum) ────────────────────────────────────── */
  const PIANO = [
    { f: 261.63, c: '#F59E0B', l: 'Do' }, { f: 293.66, c: '#F97316', l: 'Re' },
    { f: 329.63, c: '#EF4444', l: 'Mi' }, { f: 349.23, c: '#F472B6', l: 'Fa' },
    { f: 392.00, c: '#8B5CF6', l: 'Sol' }, { f: 440.00, c: '#3B82F6', l: 'La' },
    { f: 493.88, c: '#0EA5E9', l: 'Si' }, { f: 523.25, c: '#34D399', l: 'Do' }
  ];
  const DRUM = [
    { n: 'dum', c: '#EF4444', ic: DIC.dum }, { n: 'tak', c: '#F59E0B', ic: DIC.tak },
    { n: 'sss', c: '#60A5FA', ic: DIC.sss }, { n: 'deng', c: '#34D399', ic: DIC.deng },
    { n: 'tir', c: '#A78BFA', ic: DIC.tir }, { n: 'pak', c: '#F472B6', ic: DIC.pak }
  ];
  function beginSimon(g) {
    const pads = g.id === 'piano' ? PIANO : DRUM;
    const lenMax = [3, 4, 5, 6, 8][S.level - 1];
    S.state = { pads, lenMax, seq: [randInt(0, pads.length - 1)], idx: 0, mistakes: 0, phase: 'idle' };
    renderSimon();
    later(() => playSeq(), 900);
  }
  function renderSimon() {
    const st = S.state;
    const inner = S.game.id === 'piano'
      ? '<div class="keys">' + st.pads.map((p, i) => '<button class="key" style="background:' + p.c + '" data-act="pad" data-i="' + i + '" type="button" aria-label="Nada ' + p.l + '">' + p.l + '</button>').join('') + '</div>'
      : '<div class="simon-grid">' + st.pads.map((p, i) => '<button class="pad" style="background:' + p.c + '" data-act="pad" data-i="' + i + '" type="button" aria-label="Pad ' + p.n + '"><svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + p.ic + '</svg><span class="pad-n">' + p.n + '</span></button>').join('') + '</div>';
    view.innerHTML = topHTML() + roundsHTML('Nada ke-' + st.seq.length) + '<div class="stage">' + inner + '</div>';
    later(() => speak(S.game.inst), 300);
  }
  function flashPad(pi) {
    const pads = $$('[data-act="pad"]');
    const el = pads[pi]; if (!el) return;
    el.classList.add('lit');
    later(() => el.classList.remove('lit'), 420);
  }
  function padSound(pi) {
    const p = S.state.pads[pi];
    if (S.game.id === 'piano') audio.note(p.f);
    else audio.drum(p.n);
  }
  function playSeq() {
    const st = S.state;
    st.phase = 'show'; st.idx = 0;
    st.seq.forEach((pi, i) => later(() => { flashPad(pi); padSound(pi); }, i * 620));
    later(() => { st.phase = 'input'; }, st.seq.length * 620 + 250);
  }
  function onPad(b) {
    const st = S.state;
    if (st.phase !== 'input' || S.locked) return;
    const i = +b.dataset.i;
    flashPad(i); padSound(i);
    if (i === st.seq[st.idx]) {
      st.idx++;
      if (st.idx >= st.seq.length) {
        audio.ok();
        if (st.seq.length >= st.lenMax) {
          S.score = Math.min(8, st.seq.length);
          later(() => endRound(S.score), 600);
          return;
        }
        st.seq.push(randInt(0, st.pads.length - 1));
        renderSimon();
        later(() => playSeq(), 550);
      }
    } else {
      st.mistakes++; audio.bad(); shake(b);
      if (st.mistakes >= 3) {
        S.score = Math.max(1, st.seq.length - 1);
        later(() => endRound(S.score), 500);
      } else later(() => playSeq(), 900);
    }
  }

  /* ─── mesin mewarnai ────────────────────────────────────────────────── */
  const PALETTE = ['#F59E0B', '#F97316', '#EF4444', '#F472B6', '#A78BFA', '#3B82F6', '#0EA5E9', '#34D399'];
  const COLOR_SCENES = [
    { id: 'ikan', regs: ['bg', 'tail', 'body', 'fin', 'eye'],
      svg: '<svg viewBox="0 0 320 260"><rect class="reg" data-reg="bg" width="320" height="260" fill="#EDEFF3"/><circle cx="52" cy="48" r="10" fill="#EDEFF3"/><circle cx="96" cy="30" r="7" fill="#EDEFF3"/><path class="reg" data-reg="tail" d="M96 130 L40 96 L40 164 Z" fill="#EDEFF3"/><ellipse class="reg" data-reg="body" cx="176" cy="130" rx="78" ry="56" fill="#EDEFF3"/><path class="reg" data-reg="fin" d="M168 80 Q200 60 226 92 Q200 96 180 96 Z" fill="#EDEFF3"/><circle class="reg" data-reg="eye" cx="212" cy="120" r="13" fill="#EDEFF3"/></svg>' },
    { id: 'bunga', regs: ['bg', 'stem', 'leafL', 'leafR', 'petals', 'center'],
      svg: '<svg viewBox="0 0 320 300"><rect class="reg" data-reg="bg" width="320" height="300" fill="#EDEFF3"/><path class="reg" data-reg="stem" d="M156 210 Q150 150 156 96 L180 96 Q186 150 180 210 Z" fill="#EDEFF3"/><path class="reg" data-reg="leafL" d="M156 170 Q118 160 96 132 Q132 126 156 150 Z" fill="#EDEFF3"/><path class="reg" data-reg="leafR" d="M180 188 Q222 186 244 158 Q206 150 180 168 Z" fill="#EDEFF3"/><path class="reg" data-reg="petals" d="M168 26 Q208 34 218 74 Q178 70 168 40 Z M136 34 Q102 64 106 104 Q138 92 144 62 Z M96 108 Q80 146 112 168 Q124 132 122 98 Z M148 168 Q186 194 222 170 Q192 142 164 142 Z M216 120 Q238 92 224 56 Q204 88 208 118 Z" fill="#EDEFF3"/><circle class="reg" data-reg="center" cx="168" cy="110" r="34" fill="#EDEFF3"/></svg>' },
    { id: 'rumah', regs: ['bg', 'sun', 'roof', 'wall', 'door', 'window'],
      svg: '<svg viewBox="0 0 320 300"><rect class="reg" data-reg="bg" width="320" height="300" fill="#EDEFF3"/><circle class="reg" data-reg="sun" cx="258" cy="52" r="34" fill="#EDEFF3"/><path class="reg" data-reg="roof" d="M36 150 L160 34 L284 150 L258 150 L258 152 L62 152 Z" fill="#EDEFF3"/><rect class="reg" data-reg="wall" x="58" y="150" width="204" height="110" fill="#EDEFF3"/><rect class="reg" data-reg="door" x="120" y="196" width="54" height="64" rx="6" fill="#EDEFF3"/><rect class="reg" data-reg="window" x="196" y="176" width="40" height="40" rx="6" fill="#EDEFF3"/></svg>' }
  ];
  function beginColor(g) {
    const sc = pick(COLOR_SCENES);
    S.state = { scene: sc, color: 0, filled: {}, n: sc.regs.length };
    renderColor();
  }
  function renderColor() {
    const st = S.state, sc = st.scene;
    const pal = PALETTE.map((h, i) => '<button class="cbtn' + (i === st.color ? ' sel' : '') + '" style="background:' + h + '" data-act="pal" data-i="' + i + '" type="button" aria-label="Warna ' + (i + 1) + '"></button>').join('');
    view.innerHTML = topHTML() + roundsHTML('Pilih warna, lalu ketuk gambarnya') +
      '<div class="stage"><div class="color-scene">' + sc.svg + '</div>' +
      '<div class="color-pal">' + pal + '</div>' +
      '<div class="color-tools"><button class="btn btn-ghost" data-act="clear-color" type="button">Hapus Warna</button></div></div>';
    $$('.reg').forEach(el => { el.setAttribute('data-act', 'reg'); el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button'); el.setAttribute('aria-label', 'Warnai bagian ' + el.dataset.reg); });
    later(() => speak(S.game.inst), 400);
  }
  function onPal(b) {
    S.state.color = +b.dataset.i; audio.pop();
    $$('.cbtn').forEach((el, i) => el.classList.toggle('sel', i === S.state.color));
  }
  function onReg(el) {
    const st = S.state;
    const id = el.dataset.reg; if (!id || S.locked) return;
    audio.pop(); press(el);
    el.setAttribute('fill', PALETTE[st.color]);
    el.classList.add('done');
    if (!st.filled[id]) st.filled[id] = 1;
    const filled = Object.keys(st.filled).length;
    if (filled >= st.n) {
      S.locked = true;
      S.score = Math.round(filled / st.n * 8);
      later(() => endRound(S.score), 800);
    }
  }
  function clearColor() {
    $$('.reg').forEach(el => { el.setAttribute('fill', '#EDEFF3'); el.classList.remove('done'); });
    S.state.filled = {}; audio.tap();
  }

  /* ─── mesin shape builder ───────────────────────────────────────────── */
  const BUILD_SLOTS = [
    { need: 'segitiga', label: 'Atap' },
    { need: 'kotak', label: 'Dinding' },
    { need: 'persegi-panjang', label: 'Pintu' },
    { need: 'lingkaran', label: 'Matahari' },
    { need: 'bintang', label: 'Bintang' }
  ];
  function beginBuild(g) {
    S.state = { slots: BUILD_SLOTS.slice(), tray: shuffle(SET.bentuk.slice()), idx: 0 };
    renderBuild();
  }
  function renderBuild() {
    const st = S.state;
    const sil = id => { const it = BY[id]; return '<span class="sil">' + (it.draw ? it.draw(it.c) : it.svg) + '</span>'; };
    const slots = st.slots.map((s, i) =>
      '<div class="build-slot' + (i < st.idx ? ' filled' : '') + '" data-i="' + i + '">' + sil(s.need) +
      (i < st.idx ? '' : '<span class="slot-label">' + s.label + '</span>') + '</div>'
    ).join('');
    const tray = st.tray.map(it => '<button class="build-opt" data-act="bld" data-v="' + it.id + '" type="button" aria-label="' + it.name + '">' + (it.draw ? it.draw(it.c) : it.svg) + '</button>').join('');
    view.innerHTML = topHTML() + roundsHTML('Pilih bentuk yang pas untuk setiap slot') + '<div class="stage"><div class="build-scene">' + slots + '</div><div class="build-tray">' + tray + '</div></div>';
    later(() => speak(S.game.inst), 400);
  }
  function onBld(b) {
    const st = S.state;
    if (st.idx >= st.slots.length || S.locked) return;
    const v = b.dataset.v;
    audio.tap(); press(b);
    if (v === st.slots[st.idx].need) {
      audio.ok(); popEl(b); st.idx++;
      renderBuild();
      if (st.idx >= st.slots.length) {
        S.score = Math.round(st.idx / st.slots.length * 8);
        later(() => endRound(S.score), 700);
      }
    } else { audio.bad(); shake(b); }
  }

  /* ─── pencapaian ────────────────────────────────────────────────────── */
  const ACH = [
    { id: 'first',   name: 'Pertama Kali',    desc: 'Main satu permainan Seri 2',                       test: () => GAMES.some(g => pl(g.id) > 0) },
    { id: 'b10',     name: 'Bintang 10',      desc: 'Kumpulkan 10 bintang',                             test: () => totalStars() >= 10 },
    { id: 'b50',     name: 'Bintang 50',      desc: 'Kumpulkan 50 bintang',                             test: () => totalStars() >= 50 },
    { id: 'memori',  name: 'Ingatan Kuat',    desc: 'Selesaikan Memory Card dengan 6+ bintang',         test: () => st('memory-card') >= 6 },
    { id: 'puzzle',  name: 'Ahli Puzzle',     desc: 'Selesaikan Puzzle 6\u20139 Potong',                 test: () => st('puzzle-6-9') >= 1 },
    { id: 'abc',     name: 'ABC Keren',       desc: 'Mainkan kelima permainan huruf',                   test: () => ['tebak-huruf', 'huruf-besar-kecil', 'huruf-awal', 'dengarkan-pilih', 'susun-kata'].every(x => pl(x) > 0) },
    { id: 'logic',   name: 'Detektif Cilik',  desc: 'Mainkan 5 permainan logika',                       test: () => ['cari-berbeda', 'urutkan-angka', 'lanjutkan-pola', 'mana-hilang', 'puzzle-2-4'].every(x => pl(x) > 0) },
    { id: 'kreatif', name: 'Seniman Kecil',   desc: 'Mainkan 3 permainan kreatif',                      test: () => ['coloring', 'piano', 'drum', 'shape-builder'].filter(x => pl(x) > 0).length >= 3 },
    { id: 'sempurna', name: 'Luar Biasa!',    desc: 'Dapatkan 8 bintang dalam satu permainan',          test: () => GAMES.some(g => st(g.id) >= 8) },
    { id: 'rajin',   name: 'Rajin',           desc: 'Bermain di 3 hari berbeda',                        test: () => store2.get('days', []).length >= 3 }
  ];
  function checkAch() {
    const news = [];
    ACH.forEach(a => {
      if (store2.get('ach.' + a.id, false)) return;
      if (a.test()) { store2.set('ach.' + a.id, Date.now()); news.push(a); }
    });
    return news;
  }

  /* ─── akhir ronde ───────────────────────────────────────────────────── */
  function endRound(score) {
    S.score = Math.max(0, score);
    const g = S.game;
    clearTimers();
    const oldLv = lv(g.id);
    let newLv = oldLv, leveled = false;
    if (S.score >= 6 && oldLv < 5) { newLv = oldLv + 1; leveled = true; store2.set('lv.' + g.id, newLv); }
    if (S.score > st(g.id)) store2.set('st.' + g.id, S.score);
    store2.set('pl.' + g.id, pl(g.id) + 1);
    store2.set('last', g.id);
    const d = new Date();
    const day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const days = store2.get('days', []);
    if (!days.includes(day)) { days.push(day); store2.set('days', days); }
    const news = checkAch();
    audio.win(); confetti();
    let stars = '';
    for (let i = 0; i < NQ; i++) stars += '<span class="star' + (i < S.score ? ' on' : '') + '" style="animation-delay:' + (i * 50) + 'ms">' + ICON_STAR + '</span>';
    const msg = S.score >= 7 ? 'Luar biasa!' : S.score >= 5 ? 'Hebat sekali!' : S.score >= 3 ? 'Bagus!' : 'Ayo coba lagi!';
    const ach = news.length ? '<div class="ach-new">' + ICON_TROPHY + 'Penghargaan baru: <b>' + news.map(a => a.name).join(', ') + '</b></div>' : '';
    view.innerHTML = topHTML() + '<div class="stage stage-end" data-od-id="celebrate"><div class="end-card">' +
      '<div class="end-stars">' + stars + '</div>' +
      '<h2>' + msg + '</h2>' +
      '<p>Kamu mendapat <b>' + S.score + '</b> bintang.</p>' +
      (leveled ? '<div class="level-up">Naik ke Level ' + newLv + '!</div>' : '') +
      ach +
      '<div class="end-actions">' +
      '<button class="btn btn-primary" data-act="restart" type="button">Main Lagi</button>' +
      '<button class="btn btn-ghost" data-act="back-hub" type="button">Game Lain</button>' +
      '</div></div></div>';
  }
  function nextQ() {
    S.qIdx++;
    if (S.qIdx >= NQ) { endRound(S.score); return; }
    S.q = S.qgen();
    S.render();
  }

  /* ─── hub ───────────────────────────────────────────────────────────── */
  const chipOf = cat => cat === 'logika' ? 'sun' : cat === 'huruf' ? 'mint' : 'coral';
  function gcard(g) {
    const chip = chipOf(g.cat);
    const d = ' data-od-id="game-' + g.id + '" type="button">';
    if (!unlocked(g.id)) {
      return '<button class="gcard locked" data-act="open-game" data-id="' + g.id + '"' + d +
        '<span class="g-ic tile-' + chip + '"><span class="lock-g">' + ICON_LOCK + '</span></span>' +
        '<span class="g-body"><span class="g-name">' + g.name + '</span><span class="g-meta">Kunci · ' + g.u + ' bintang</span></span></button>';
    }
    const lvN = lv(g.id), stN = st(g.id);
    return '<button class="gcard" data-act="open-game" data-id="' + g.id + '"' + d +
      '<span class="g-ic tile-' + chip + '">' + g.icon + '</span>' +
      '<span class="g-body"><span class="g-name">' + g.name + '</span>' +
      '<span class="g-meta">Level ' + lvN + (stN ? '<span style="display:inline-flex;align-items:center;gap:2px">' + ICON_STAR + stN + '</span>' : '') + '</span></span></button>';
  }
  function hubHTML() {
    const last = GAMES.find(g => g.id === store2.get('last', null));
    const resume = last
      ? '<button class="resume" data-act="open-game" data-id="' + last.id + '" data-od-id="resume-play" type="button">' +
        '<span class="g-ic tile-' + chipOf(last.cat) + '">' + last.icon + '</span>' +
        '<span class="resume-txt"><span class="resume-l">Lanjut bermain: ' + last.name + '</span><span class="resume-s">Level ' + lv(last.id) + ' · mulai ronde baru</span></span>' +
        ICON_STAR + '</button>'
      : '';
    const ts = totalStars();
    const next = GAMES.filter(g => !unlocked(g.id)).sort((a, b) => a.u - b.u)[0];
    const pct = Math.min(100, Math.round(ts / 28 * 100));
    const pstrip = '<div class="pstrip">' + ICON_STAR + '<div class="pstrip-bar"><div class="pstrip-fill" style="width:' + pct + '%"></div></div>' +
      '<span class="pstrip-txt">' + ts + ' bintang' + (next ? ' · buka ' + next.name : ' · semua terbuka!') + '</span></div>';
    const cats = CATS.map(c => {
      const games = GAMES.filter(g => g.cat === c.id);
      return '<section class="cat" data-od-id="cat-' + c.id + '">' +
        '<div class="cat-head"><span class="cat-chip chip-' + c.chip + '">' + c.icon + '</span><span class="cat-name">' + c.name + '</span><span class="cat-desc">' + c.desc + '</span></div>' +
        '<div class="grid">' + games.map(gcard).join('') + '</div></section>';
    }).join('');
    return '<header class="brand-row"><div class="brand"><span class="brand-dot"></span>Kila</div><span class="tagline">Seri 2 · belajar & bermain</span>' +
      '<a class="tbtn" href="kila-games.html" aria-label="Buka Seri 1 — 17 game lama">' + ICON_HOME + '</a>' +
      '<button class="tbtn" data-act="parent" aria-label="Menu orang tua">' + ICON_USER + '</button>' +
      '<button class="tbtn" id="mutebtn" data-act="mute" type="button" aria-label="' + (muted ? 'Nyalakan suara' : 'Matikan suara') + '">' + (muted ? ICON_MUTE : ICON_SOUND) + '</button></header>' +
      resume + pstrip +
      '<p class="hub-note">17 permainan baru: memori, logika, huruf, mewarnai & musik. Kumpulkan bintang untuk membuka game berikutnya — bintang Seri 1 ikut dihitung.</p>' +
      '<div class="hub" data-od-id="game-hub">' + cats + '</div>' +
      '<p class="foot">Kila Seri 2 — tanpa iklan, aman untuk anak 2\u20137 tahun. Cek laporan orang tua lewat tombol orang tua di atas.</p>';
  }

  /* ─── layar orang tua ───────────────────────────────────────────────── */
  function showParent() {
    clearTimers(); stopSpeak();
    const ts = totalStars();
    const played = GAMES.filter(g => pl(g.id) > 0).length + P1GAMES.filter(g => p1st(g.id) > 0).length;
    const done = GAMES.filter(g => st(g.id) > 0).length + P1GAMES.filter(g => p1st(g.id) > 0).length;
    const achGot = ACH.filter(a => store2.get('ach.' + a.id, false)).length;
    const cats = CATS.map(c => {
      const gl = GAMES.filter(g => g.cat === c.id);
      const cd = gl.filter(g => st(g.id) > 0).length;
      const cs = gl.reduce((s, g) => s + st(g.id), 0);
      return '<div class="pcat"><span>' + c.name + '</span><span>' + cd + '/' + gl.length + ' game · ' + cs + ' bintang</span></div>' +
        '<div class="pbar"><div class="pstrip-bar"><div class="pstrip-fill" style="width:' + Math.round(cd / gl.length * 100) + '%"></div></div></div>';
    }).join('');
    const p1d = P1GAMES.filter(g => p1st(g.id) > 0).length;
    const p1s = P1GAMES.reduce((s, g) => s + p1st(g.id), 0);
    const all = [...GAMES.map(g => ({ name: g.name, s: st(g.id) })), ...P1GAMES.map(g => ({ name: g.name, s: p1st(g.id) }))];
    const favs = all.filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3);
    const favHTML = favs.length
      ? favs.map(f => '<div class="fav-row"><span class="g-ic tile-sun">' + ICON_STAR + '</span><span style="flex:1">' + f.name + '</span><b>' + f.s + '</b></div>').join('')
      : '<p class="pnote">Belum ada favorit — bintang dari game akan muncul di sini.</p>';
    const achHTML = ACH.map(a => {
      const got = store2.get('ach.' + a.id, false);
      return '<span class="ach-chip' + (got ? ' got' : '') + '">' + ICON_TROPHY + ' ' + a.name + (got ? '' : ' · ' + a.desc) + '</span>';
    }).join('');
    const free = store2.get('free', false);
    view.innerHTML = '<header class="top">' +
      '<button class="tbtn" data-act="back-hub" type="button" aria-label="Kembali">' + ICON_BACK + '</button>' +
      '<div class="top-t"><span class="top-name">Untuk Orang Tua</span></div>' +
      '<button class="tbtn" id="mutebtn" data-act="mute" type="button" aria-label="' + (muted ? 'Nyalakan suara' : 'Matikan suara') + '">' + (muted ? ICON_MUTE : ICON_SOUND) + '</button></header>' +
      '<div class="parent-card" data-od-id="parent-screen">' +
      '<h2>Laporan Belajar</h2>' +
      '<div class="pstats">' +
      '<div class="pstat"><b>' + ts + '</b><span>Total bintang</span></div>' +
      '<div class="pstat"><b>' + played + '</b><span>Game dimainkan</span></div>' +
      '<div class="pstat"><b>' + done + '</b><span>Game selesai</span></div>' +
      '<div class="pstat"><b>' + achGot + '/' + ACH.length + '</b><span>Penghargaan</span></div>' +
      '</div>' +
      '<h2 style="font-size:16px">Kemajuan per kategori</h2>' +
      cats +
      '<div class="pcat"><span>Seri 1 (17 game)</span><span>' + p1d + '/17 game · ' + p1s + ' bintang</span></div>' +
      '<div class="pbar"><div class="pstrip-bar"><div class="pstrip-fill" style="width:' + Math.round(p1d / 17 * 100) + '%"></div></div></div>' +
      '<h2 style="font-size:16px">Game favorit</h2>' + favHTML +
      '<h2 style="font-size:16px">Penghargaan (' + achGot + '/' + ACH.length + ')</h2>' +
      '<div class="ach-list">' + achHTML + '</div>' +
      '<div class="ptools">' +
      '<button class="btn btn-ghost" data-act="free" data-od-id="toggle-free" type="button">' + (free ? 'Mode Bebas: Nyala' : 'Mode Bebas: Mati') + '</button>' +
      '<button class="btn btn-ghost" data-act="reset" data-od-id="reset-progress" type="button">Hapus Progres</button>' +
      '</div>' +
      '<p class="pnote">Mode Bebas membuka semua game Seri 2 tanpa mengumpulkan bintang. "Hapus Progres" hanya menghapus data Seri 2 & pencapaian — data Seri 1 tetap aman.</p>' +
      '</div>';
  }
  function toggleFree(b) {
    const v = !store2.get('free', false);
    store2.set('free', v); audio.tap();
    b.textContent = v ? 'Mode Bebas: Nyala' : 'Mode Bebas: Mati';
  }
  function confirmReset(b) {
    if (b.dataset.step !== '2') {
      b.dataset.step = '2'; b.textContent = 'Yakin? Tekan lagi';
      later(() => { b.dataset.step = ''; b.textContent = 'Hapus Progres'; }, 2600);
      return;
    }
    try {
      Object.keys(localStorage).forEach(k => { if (k.indexOf('kila.p2.') === 0 || k.indexOf('kila.ach.') === 0) localStorage.removeItem(k); });
    } catch (e) {}
    audio.tap();
    showParent();
  }

  /* ─── navigasi & inisialisasi ───────────────────────────────────────── */
  function startGame(id) {
    clearTimers(); stopSpeak();
    const g = GAMES.find(x => x.id === id); if (!g) return;
    if (!unlocked(id)) { audio.bad(); speak('Kumpulkan bintang dulu ya!'); return; }
    S = { game: g, level: lv(id), score: 0, qIdx: 0, q: null, locked: false, state: {}, qgen: null, render: null };
    store2.set('last', id);
    window.scrollTo(0, 0);
    if (g.t === 'letter' || g.t === 'odd' || g.t === 'pat' || g.t === 'miss' || g.t === 'order') {
      S.qgen = g.t === 'letter' ? letterQ : g.t === 'odd' ? oddQ : g.t === 'pat' ? patQ : g.t === 'miss' ? missQ : orderQ;
      S.render = g.t === 'letter' ? renderLetterQ : g.t === 'odd' ? renderOddQ : g.t === 'pat' ? renderPatQ : g.t === 'miss' ? renderMissQ : renderOrderQ;
      S.q = S.qgen();
      S.render();
      later(() => speak(g.inst), 350);
    } else if (g.t === 'memory') { beginMemory(g); }
    else if (g.t === 'puzzle') { beginPuzzle(g); }
    else if (g.t === 'simon') { beginSimon(g); }
    else if (g.t === 'color') { beginColor(g); }
    else if (g.t === 'build') { beginBuild(g); }
  }
  function showHub() {
    clearTimers(); stopSpeak();
    window.scrollTo(0, 0);
    view.innerHTML = hubHTML();
  }
  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('kila.g.muted', String(muted)); } catch (e) {}
    const mb = $('#mutebtn');
    if (mb) { mb.innerHTML = muted ? ICON_MUTE : ICON_SOUND; mb.setAttribute('aria-label', muted ? 'Nyalakan suara' : 'Matikan suara'); }
    if (muted) stopSpeak();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'open-game') startGame(b.dataset.id);
    else if (act === 'back-hub') showHub();
    else if (act === 'restart') startGame(S.game.id);
    else if (act === 'mute') toggleMute();
    else if (act === 'parent') showParent();
    else if (act === 'free') toggleFree(b);
    else if (act === 'reset') confirmReset(b);
    else if (act === 'speak') { audio.pop(); speak(S.game.t === 'letter' ? 'Mana huruf ' + b.dataset.v + '?' : S.speakTxt); }
    else if (act === 'answer') onAnswer(b);
    else if (act === 'card') onCard(b);
    else if (act === 'odd') onOdd(b);
    else if (act === 'ord') onOrd(b);
    else if (act === 'pat') onPat(b);
    else if (act === 'miss') onMiss(b);
    else if (act === 'pzl') onPzl(b);
    else if (act === 'pad') onPad(b);
    else if (act === 'pal') onPal(b);
    else if (act === 'reg') onReg(b);
    else if (act === 'bld') onBld(b);
    else if (act === 'clear-color') clearColor();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest('.reg');
    if (el) { e.preventDefault(); onReg(el); }
  });

  showHub();
  </script>
</body>
</html>
