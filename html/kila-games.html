<!doctype html>
<!--
  Kila Games — MVP bermain & belajar untuk anak 2–7 tahun.
  Mobile-first, satu file: hub + 17 permainan playable via satu mesin bersama.
  Level 1–5, feedback instan, animasi (WAAPI + CSS), suara sintesis (Web Audio),
  mode audio (L4–5), progres tersimpan di localStorage.
  Token: direction human-approachable (sama dengan kila-homepage.html).
-->
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kila Games: 17 permainan belajar untuk anak usia 2–7 tahun — kenali, cocokkan, hitung. Aman, tanpa iklan, dengan suara & animasi." />
  <meta name="theme-color" content="#f8fafc" />
  <title>Kila Games · Belajar sambil bermain untuk anak 2–7 tahun</title>
  <style>
    /* ─── tokens (direction human-approachable, sama dengan homepage) ─── */
    :root {
      --bg:      oklch(98% 0.004 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(20% 0.02 240);
      --muted:   oklch(50% 0.018 240);
      --muted-strong: color-mix(in oklch, var(--muted) 76%, black);
      --border:  oklch(90% 0.006 240);
      --accent:  oklch(56% 0.12 170);

      --sun:     oklch(0.80 0.16 88);
      --mint:    oklch(0.74 0.13 158);
      --coral:   oklch(0.73 0.16 30);
      --sky:     oklch(0.72 0.12 235);
      --grape:   oklch(0.66 0.20 295);
      --pink:    oklch(0.70 0.19 345);
      --ink-sun:   color-mix(in oklch, var(--sun) 52%, black);
      --ink-mint:  color-mix(in oklch, var(--mint) 52%, black);
      --ink-coral: color-mix(in oklch, var(--coral) 52%, black);
      --ink-sky:   color-mix(in oklch, var(--sky) 52%, black);
      --tile-sun:   color-mix(in oklch, var(--sun) 24%, var(--surface));
      --tile-mint:  color-mix(in oklch, var(--mint) 24%, var(--surface));
      --tile-coral: color-mix(in oklch, var(--coral) 24%, var(--surface));
      --tile-sky:   color-mix(in oklch, var(--sky) 24%, var(--surface));
      --tile-grape: color-mix(in oklch, var(--grape) 24%, var(--surface));
      --tile-pink:  color-mix(in oklch, var(--pink) 24%, var(--surface));

      --accent-deep: color-mix(in oklch, var(--accent) 82%, black);
      --accent-text: color-mix(in oklch, var(--accent) 64%, black);
      --ok:   oklch(0.62 0.16 155);
      --ok-soft:   color-mix(in oklch, var(--ok) 16%, var(--surface));
      --err:  oklch(0.58 0.18 26);
      --err-soft:  color-mix(in oklch, var(--err) 16%, var(--surface));
      --gold: oklch(0.80 0.16 85);

      --font-display: 'Söhne', 'Avenir Next', 'Avenir', 'Century Gothic', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

      --fs-body: 16px;
      --fs-meta: 13px;
      --gutter: clamp(18px, 5vw, 30px);
      --radius: 14px;
      --radius-lg: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    p { margin: 0; }
    :focus-visible {
      outline: 3px solid color-mix(in oklch, var(--accent) 45%, transparent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .app { max-width: 560px; margin: 0 auto; padding: var(--gutter) var(--gutter) 72px; }
    .i { width: 24px; height: 24px; }

    /* ─── hub ─────────────────────────────────────────────────────────── */
    .brand-row { display: flex; align-items: center; gap: 12px; padding: 6px 0 0; flex-wrap: wrap; }
    .brand { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 7vw, 32px); letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
    .brand-dot { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); }
    .tagline { font-size: var(--fs-meta); color: var(--muted-strong); margin-right: auto; }
    .hub-note { background: var(--tile-sun); color: var(--ink-sun); font-size: var(--fs-meta); padding: 10px 14px; border-radius: var(--radius); margin: 16px 0 4px; }

    .resume { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; width: 100%; margin-top: 16px; text-align: left; box-shadow: 0 4px 14px color-mix(in oklch, var(--fg) 6%, transparent); }
    .resume:hover { border-color: color-mix(in oklch, var(--fg) 24%, transparent); }
    .resume-txt { flex: 1; min-width: 0; }
    .resume-l { font-family: var(--font-display); font-weight: 800; font-size: 15px; display: block; }
    .resume-s { font-size: 12px; color: var(--muted-strong); }

    .cat { margin-top: var(--radius); }
    .cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .cat-chip { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
    .cat-chip .i { width: 21px; height: 21px; }
    .chip-sun { background: var(--sun); }
    .chip-mint { background: var(--mint); }
    .chip-coral { background: var(--coral); }
    .cat-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
    .cat-desc { font-size: 12px; color: var(--muted-strong); margin-left: auto; text-align: right; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .gcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; text-align: left; box-shadow: 0 1px 2px color-mix(in oklch, var(--fg) 4%, transparent); transition: transform .15s ease, box-shadow .15s ease; }
    .gcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px color-mix(in oklch, var(--fg) 10%, transparent); }
    .gcard:active { transform: scale(0.98); }
    .g-ic { position: relative; width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; }
    .g-ic::before { content: ""; position: absolute; inset: 5px; background: var(--surface); border-radius: 11px; }
    .g-ic svg { position: relative; width: 36px; height: 36px; }
    .tile-sun { background: var(--tile-sun); } .tile-mint { background: var(--tile-mint); } .tile-coral { background: var(--tile-coral); } .tile-sky { background: var(--tile-sky); } .tile-grape { background: var(--tile-grape); } .tile-pink { background: var(--tile-pink); }
    .g-name { font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1.2; }
    .g-meta { font-size: 12px; color: var(--muted-strong); display: flex; align-items: center; gap: 5px; }
    .g-meta .i { width: 13px; height: 13px; color: var(--gold); }

    .foot { margin-top: var(--radius); text-align: center; font-size: 12px; color: var(--muted); }

    /* ─── top bar permainan ───────────────────────────────────────────── */
    .top { display: flex; align-items: center; gap: 10px; padding: 4px 0 16px; }
    .tbtn { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--fg); flex: none; }
    .tbtn:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .tbtn .i { width: 22px; height: 22px; }
    .top-t { flex: 1; min-width: 0; }
    .top-name { display: block; font-family: var(--font-display); font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { display: inline-block; background: var(--tile-sky); color: var(--ink-sky); font-family: var(--font-mono); font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 999px; margin-top: 2px; }
    .stars-line { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-weight: 800; font-size: 15px; color: var(--ink-coral); background: var(--tile-coral); padding: 9px 13px; border-radius: 999px; flex: none; }
    .stars-line .i { width: 16px; height: 16px; color: var(--gold); }

    .prog { display: flex; gap: 7px; justify-content: center; margin: 0 auto 20px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; background: color-mix(in oklch, var(--fg) 10%, transparent); transition: transform .2s ease; }
    .dot.done { background: var(--accent-deep); }
    .dot.cur { background: var(--accent); transform: scale(1.35); }

    /* ─── panggung soal ───────────────────────────────────────────────── */
    .stage { animation: rise .35s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .qa { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .q-text { font-family: var(--font-display); font-weight: 800; font-size: clamp(20px, 5.5vw, 24px); text-align: center; }
    .q-text b { color: var(--ink-coral); }

    .target { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 10px 30px color-mix(in oklch, var(--fg) 8%, transparent); width: min(224px, 66vw); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .t-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
    .color-block { display: block; border-radius: 16px; height: 88px; width: 100%; }
    .target-block { height: 110px; border: 4px solid color-mix(in oklch, var(--fg) 8%, transparent); }

    .pic { display: grid; place-items: center; width: clamp(76px, 23vw, 94px); height: clamp(76px, 23vw, 94px); border-radius: 50%; background: color-mix(in oklch, var(--fg) 5%, var(--surface)); border: 1px solid var(--border); }
    .pic svg { width: clamp(54px, 16vw, 70px); height: clamp(54px, 16vw, 70px); }
    .pic-lg { width: 120px; height: 120px; border-radius: 50%; }
    .pic-lg svg { width: 96px; height: 96px; }

    .speak-btn { width: 84px; height: 84px; border-radius: 50%; border: none; background: var(--accent-deep); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px color-mix(in oklch, var(--accent) 35%, transparent); }
    .speak-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px color-mix(in oklch, var(--accent) 40%, transparent); }
    .speak-btn .i { width: 38px; height: 38px; }

    .opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 520px; }
    .opt { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 9px; min-height: 118px; transition: transform .12s ease, border-color .15s ease, background .15s ease; }
    .opt:hover { border-color: color-mix(in oklch, var(--fg) 28%, transparent); }
    .opt:active { transform: scale(0.97); }
    .opt:disabled { cursor: default; }
    .opt-name { font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.1; }
    .opt.right { background: var(--ok-soft); border-color: var(--ok); animation: pop .4s cubic-bezier(.34, 1.56, .64, 1); }
    .opt.right .opt-name { color: color-mix(in oklch, var(--ok) 60%, black); }
    .opt.wrong { background: var(--err-soft); border-color: var(--err); }

    @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .opts-num { grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); }
    .opt.num { min-height: 82px; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 9vw, 34px); }

    .count-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 520px; min-height: 130px; align-content: center; padding: 8px; }
    .count-group .obj { animation: objIn .45s cubic-bezier(.34, 1.56, .64, 1) backwards; }
    @keyframes objIn { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    .count-group .pic { width: 58px; height: 58px; border-radius: 16px; }
    .count-group .pic svg { width: 44px; height: 44px; }

    .opts-grp { grid-template-columns: 1fr; }
    @media (min-width: 480px) { .opts-grp { grid-template-columns: 1fr 1fr; } }
    .opt.grp { position: relative; min-height: 150px; padding: 14px; }
    .grp-badge { position: absolute; top: 10px; left: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--fg-soft, color-mix(in oklch, var(--fg) 6%, transparent)); color: var(--muted-strong); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 800; font-size: 12px; }
    .grp-items { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; width: 100%; }
    .grp-items .pic { width: 52px; height: 52px; border-radius: 14px; }
    .grp-items .pic svg { width: 38px; height: 38px; }

    /* ─── layar akhir / selebrasi ─────────────────────────────────────── */
    .stage-end { display: flex; justify-content: center; padding-top: 10px; }
    .end-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 16px 40px color-mix(in oklch, var(--fg) 10%, transparent); padding: 28px 20px; width: min(420px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .end-card h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 7vw, 32px); margin: 0; }
    .end-card p { color: var(--muted-strong); }
    .end-stars { display: flex; gap: 4px; margin: 6px 0 2px; }
    .star { color: color-mix(in oklch, var(--fg) 14%, transparent); }
    .star .i { width: 26px; height: 26px; }
    .star.on { color: var(--gold); animation: pop .45s cubic-bezier(.34, 1.56, .64, 1) backwards; }
    .level-up { background: var(--tile-mint); color: var(--ink-mint); font-family: var(--font-display); font-weight: 800; font-size: 15px; padding: 9px 16px; border-radius: 999px; }
    .end-actions { display: flex; gap: 12px; margin-top: 8px; width: 100%; }
    .btn { border: none; border-radius: 999px; padding: 16px 18px; font-family: var(--font-display); font-weight: 800; font-size: 16px; flex: 1; min-height: 52px; transition: transform .12s ease, box-shadow .15s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent-deep); color: #fff; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px color-mix(in oklch, var(--accent) 30%, transparent); }
    .btn-ghost { background: var(--surface); border: 2px solid var(--border); color: var(--fg); }
    .btn-ghost:hover { border-color: color-mix(in oklch, var(--fg) 30%, transparent); }

    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 70; }
    .confetti span { position: absolute; top: -24px; display: block; border-radius: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="view" data-od-id="games-app" role="main"></div>
  <script>
  'use strict';
  /* ─── helpers ────────────────────────────────────────────────────────── */
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const view = $('#view');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem('kila.g.' + k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('kila.g.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[randInt(0, arr.length - 1)];
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const ic = s => '<svg class="ic" viewBox="0 0 64 64" aria-hidden="true">' + s + '</svg>';

  /* ─── ikon UI (bukan emoji) ──────────────────────────────────────────── */
  const ICON_BACK  = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_SOUND = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l6 5V4L8 9Z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  const ICON_MUTE  = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l6 5V4L8 9Z" fill="currentColor"/><path d="m17 10 5 5m0-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICON_SPEAK = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l6 5V4L8 9Z" fill="currentColor"/><path d="M15 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  const ICON_STAR  = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8Z" fill="currentColor"/></svg>';
  const ICON_KENALI = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="4" fill="#fff"/><circle cx="17" cy="6" r="4" fill="#fff" opacity=".85"/><circle cx="17" cy="18" r="4" fill="#fff" opacity=".85"/></svg>';
  const ICON_COCOK  = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="16" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2.4"/></svg>';
  const ICON_HITUNG = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V6h2v12Z M11 18v-8h2v8Z M17 18v-6h2v6Z" fill="#fff"/></svg>';

  /* ─── data gambar (piktogram flat — konten permainan) ───────────────── */
  const SETS = {
    warna: [
      { id: 'merah',  name: 'Merah',  hex: '#EF4444', near: ['#DC2626', '#F87171'] },
      { id: 'biru',   name: 'Biru',   hex: '#3B82F6', near: ['#2563EB', '#60A5FA'] },
      { id: 'kuning', name: 'Kuning', hex: '#FACC15', near: ['#EAB308', '#FDE047'] },
      { id: 'hijau',  name: 'Hijau',  hex: '#22C55E', near: ['#16A34A', '#4ADE80'] },
      { id: 'oranye', name: 'Oranye', hex: '#F97316', near: ['#EA580C', '#FB923C'] },
      { id: 'ungu',   name: 'Ungu',   hex: '#8B5CF6', near: ['#7C3AED', '#A78BFA'] },
      { id: 'pink',   name: 'Pink',   hex: '#EC4899', near: ['#DB2777', '#F472B6'] },
      { id: 'coklat', name: 'Coklat', hex: '#B45309', near: ['#92400E', '#C56B1B'] },
      { id: 'abu-abu',  name: 'Abu-abu', hex: '#9CA3AF', near: ['#6B7280', '#B7BEC9'] },
      { id: 'toska',    name: 'Toska',   hex: '#0D9488', near: ['#0F766E', '#14B8A6'] },
      { id: 'hitam',    name: 'Hitam',   hex: '#1F2937', near: ['#111827', '#374151'] }
    ],
    bentuk: [
      { id: 'lingkaran',       name: 'Lingkaran',       c: '#F97316', draw: c => ic('<circle cx="32" cy="32" r="21" fill="' + c + '"/>') },
      { id: 'kotak',           name: 'Kotak',           c: '#3B82F6', draw: c => ic('<rect x="13" y="13" width="38" height="38" rx="7" fill="' + c + '"/>') },
      { id: 'segitiga',        name: 'Segitiga',        c: '#22C55E', draw: c => ic('<path d="M32 10 L55 52 L9 52 Z" fill="' + c + '"/>') },
      { id: 'persegi-panjang', name: 'Persegi Panjang', c: '#8B5CF6', draw: c => ic('<rect x="9" y="21" width="46" height="28" rx="6" fill="' + c + '"/>') },
      { id: 'bintang',         name: 'Bintang',         c: '#FACC15', draw: c => ic('<path d="M32 8 L39.5 24 L56 24 L43 35 L48 52 L32 42 L16 52 L21 35 L8 24 L24.5 24 Z" fill="' + c + '"/>') }
    ],

      o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + d + 0.05);

      const head = q.audio
        ? '<button class="speak-btn" data-act="speak" data-v="' + q.target.id + '" type="button" aria-label="Dengar nama">' + ICON_SPEAK + '</button><p class="q-text">Manakah <b>' + q.target.name + '</b>?</p>'
        : '<div class="target">' + targetHTML(q.target) + '</div><p class="q-text">Manakah yang sama?</p>';
      body = '<div class="qa">' + head + '<div class="opts">' + q.opts.map(optHTML).join('') + '</div></div>';
    } else if (q.type === 'pair') {
      const head = q.audio
        ? '<button class="speak-btn" data-act="speak" data-v="' + q.from.id + '" type="button" aria-label="Dengar nama">' + ICON_SPEAK + '</button><p class="q-text">Manakah pasangan <b>' + q.from.name + '</b>?</p>'
        : '<div class="target">' + targetHTML(q.from) + '</div><p class="q-text">Pilih pasangannya</p>';
      body = '<div class="qa">' + head + '<div class="opts">' + q.opts.map(o => optHTML({ item: o })).join('') + '</div></div>';
    } else if (q.type === 'count') {
      const objs = Array.from({ length: q.n }, (_, i) => '<span class="obj" style="animation-delay:' + (i * 90) + 'ms">' + iconPic(q.item) + '</span>').join('');
      body = '<div class="qa"><div class="count-group">' + objs + '</div><p class="q-text">Berapa banyak?</p><div class="opts opts-num">' + q.opts.map(n => '<button class="opt num" data-act="answer" data-v="' + n + '" type="button">' + n + '</button>').join('') + '</div></div>';
    } else {
      body = '<div class="qa"><p class="q-text">Yang mana lebih banyak?</p><div class="opts opts-grp">' + grpBtn('A', q.A) + grpBtn('B', q.B) + '</div></div>';
    }
    view.innerHTML = topHTML() + progHTML() + '<div class="stage" data-od-id="game-screen">' + body + '</div>';
    if (q.type === 'count') { for (let i = 0; i < q.n; i++) setTimeout(() => audio.tick(), 260 + i * 90); }
    if (q.audio) setTimeout(() => speak(q.speakText), 420);
  }

  function onAnswer(b) {
    if (S.locked || S.answered) return;
    const q = S.q; const v = b.dataset.v;
    let ok = false;
    if (q.type === 'pick') ok = v === q.target.id;
    else if (q.type === 'pair') ok = v === q.to.id;
    else if (q.type === 'count') ok = parseInt(v, 10) === q.n;
    else ok = v === q.answer;
    audio.tap(); press(b);
    if (ok) {
      stopSpeak();
      b.classList.add('right'); popEl(b); audio.ok();
      S.score++; S.answered = true; S.locked = true;
      $$('.opt:not(.right)').forEach(o => { o.disabled = true; });
      bumpStars();
      setTimeout(nextQ, 780);
    } else {
      if (b.disabled) return;
      b.classList.add('wrong'); b.disabled = true; shake(b); audio.bad();
    }
  }

  function nextQ() {
    S.qIdx++;
    if (S.qIdx >= NQ) endRound(); else renderQuestion();
  }

  function endRound() {
    const g = S.game; const sc = S.score;
    const oldLv = store.get('lv.' + g.id, 1);
    let newLv = oldLv, leveled = false;
    if (sc >= 6 && oldLv < 5) { newLv = oldLv + 1; leveled = true; store.set('lv.' + g.id, newLv); }
    const best = store.get('st.' + g.id, 0);
    if (sc > best) store.set('st.' + g.id, sc);
    store.set('last', g.id);
    audio.win(); confetti();
    let stars = '';
    for (let i = 0; i < NQ; i++) stars += '<span class="star' + (i < sc ? ' on' : '') + '" style="animation-delay:' + (i * 50) + 'ms">' + ICON_STAR + '</span>';
    const msg = sc >= 7 ? 'Luar biasa!' : sc >= 5 ? 'Hebat sekali!' : sc >= 3 ? 'Bagus!' : 'Ayo coba lagi!';
    view.innerHTML = topHTML() + '<div class="stage stage-end" data-od-id="celebrate">' +
      '<div class="end-card">' +
      '<div class="end-stars">' + stars + '</div>' +
      '<h2>' + msg + '</h2>' +
      '<p>Kamu mendapat <b>' + sc + '</b> bintang dari ' + NQ + '.</p>' +
      (leveled ? '<div class="level-up">Naik ke Level ' + newLv + '!</div>' : '') +
      '<div class="end-actions">' +
      '<button class="btn btn-primary" data-act="restart" type="button">Main Lagi</button>' +
      '<button class="btn btn-ghost" data-act="back-hub" type="button">Game Lain</button>' +
      '</div></div></div>';
  }

  function startGame(id) {
    stopSpeak();
    const g = GAMES.find(x => x.id === id); if (!g) return;
    const lv = store.get('lv.' + id, 1);
    S = { game: g, level: lv, questions: [], qIdx: 0, score: 0, q: null, answered: false, locked: false };
    S.questions = Array.from({ length: NQ }, () => genQuestion());
    renderQuestion();
  }

  function hubHTML() {
    const last = GAMES.find(g => g.id === store.get('last', null));
    const resume = last
      ? '<button class="resume" data-act="open-game" data-id="' + last.id + '" data-od-id="resume-play" type="button">' +
        '<span class="g-ic tile-coral">' + last.icon + '</span>' +
        '<span class="resume-txt"><span class="resume-l">Lanjut bermain: ' + last.name + '</span><span class="resume-s">Level ' + store.get('lv.' + last.id, 1) + ' · mulai ronde baru</span></span>' +
        ICON_STAR + '</button>'
      : '';
    const cats = CATS.map(c => {
      const games = GAMES.filter(g => g.cat === c.id);
      return '<section class="cat" data-od-id="cat-' + c.id + '">' +
        '<div class="cat-head"><span class="cat-chip chip-' + c.chip + '">' + c.icon + '</span><span class="cat-name">' + c.name + '</span><span class="cat-desc">' + c.desc + '</span></div>' +
        '<div class="grid">' + games.map(g => gcard(g, c.chip)).join('') + '</div></section>';
    }).join('');
    return '<header class="brand-row"><div class="brand"><span class="brand-dot"></span>Kila</div><span class="tagline">Game belajar untuk anak 2–7 tahun</span>' +
      '<button class="tbtn" id="mutebtn" data-act="mute" type="button" aria-label="' + (muted ? 'Nyalakan suara' : 'Matikan suara') + '">' + (muted ? ICON_MUTE : ICON_SOUND) + '</button></header>' +
      resume +
      '<p class="hub-note">Setiap permainan menyesuaikan level 1–5. Semakin tinggi level, semakin banyak pilihan. Suara menyala otomatis — bisa dimatikan dari tombol di pojok atas.</p>' +
      '<div class="hub" data-od-id="game-hub">' + cats + '</div>' +
      '<p class="foot">Kila — belajar sambil bermain. Tanpa iklan, ramah untuk anak 2–7 tahun.</p>';
  }
  function gcard(g, chip) {
    const lv = store.get('lv.' + g.id, 1), st = store.get('st.' + g.id, 0);
    return '<button class="gcard" data-act="open-game" data-id="' + g.id + '" data-od-id="game-' + g.id + '" type="button">' +
      '<span class="g-ic tile-' + chip + '">' + g.icon + '</span>' +
      '<span class="g-body"><span class="g-name">' + g.name + '</span>' +
      '<span class="g-meta">Level ' + lv + (st ? '<span style="display:inline-flex;align-items:center;gap:2px">' + ICON_STAR + st + '</span>' : '') + '</span></span></button>';
  }

  function showHub() { stopSpeak(); window.scrollTo(0, 0); view.innerHTML = hubHTML(); }
  function speakTarget(v) { const it = BY[v]; if (it) { audio.pop(); speak(it.name); } }
  function toggleMute() {
    muted = !muted; store.set('muted', muted);
    const mb = $('#mutebtn');
    if (mb) { mb.innerHTML = muted ? ICON_MUTE : ICON_SOUND; mb.setAttribute('aria-label', muted ? 'Nyalakan suara' : 'Matikan suara'); }
    if (muted) stopSpeak();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'open-game') startGame(b.dataset.id);
    else if (act === 'back-hub') showHub();
    else if (act === 'speak') speakTarget(b.dataset.v);
    else if (act === 'answer') onAnswer(b);
    else if (act === 'restart') startGame(S.game.id);
    else if (act === 'mute') toggleMute();
  });

  showHub();
  </script>
</body>
</html>
